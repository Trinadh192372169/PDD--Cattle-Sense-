name: Android Appium E2E Automation & CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  android-e2e-testing:
    runs-on: ubuntu-latest

    steps:
      - name: Stage 1: Checkout Repository
        uses: actions/checkout@v4

      - name: Stage 2: Setup Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Stage 3: Install Test Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas openpyxl requests pytest jinja2

      - name: Stage 4: Execute Appium Mobile E2E Test Suite (400+ Test Cases)
        run: |
          python automation/mobile/run_appium_tests.py

      - name: Stage 5: Generate Excel, HTML & Executive Summary Reports
        run: |
          python automation/mobile/generate_mobile_reports.py

      - name: Stage 6: Upload Test Artifacts (Excel & HTML Reports)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Appium-Mobile-E2E-Reports
          path: Test_Results/
          retention-days: 30

      - name: Stage 7: Publish GitHub Action Step Summary
        if: always()
        run: |
          if [ -f "Test_Results/Summary/summary.md" ]; then
            cat "Test_Results/Summary/summary.md" >> $GITHUB_STEP_SUMMARY
          fi
