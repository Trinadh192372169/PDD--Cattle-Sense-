name: Android Appium E2E Automation & CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  android-e2e-testing:
    runs-on: ubuntu-latest

    steps:
      - name: Stage 1: Checkout Repository
        uses: actions/checkout@v4

      - name: Stage 2: Setup Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Stage 3: Execute Appium Mobile E2E Test Suite (300+ Test Cases)
        run: python automation/mobile/run_appium_tests.py

      - name: Stage 4: Generate Excel, HTML & Executive Summary Reports
        run: python automation/mobile/generate_mobile_reports.py
