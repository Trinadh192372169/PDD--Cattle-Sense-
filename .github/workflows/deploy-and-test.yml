name: Web Selenium E2E Automation, Security Audit & GitHub Pages Deployment

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  deploy-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Stage 1: Checkout Repository
        uses: actions/checkout@v4

      - name: Stage 2: Setup Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Stage 3: Execute Selenium Web E2E Test Suite (300+ Test Cases)
        run: python automation/web/run_selenium_tests.py

      - name: Stage 4: Run Backend Security Audit & Baseline Load Testing
        run: python automation/security/run_security_audit.py

      - name: Stage 5: Generate Enterprise Excel & HTML Reports
        run: python automation/web/generate_web_reports.py
