<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact CattleSense</title>
    <style>
      :root { --bg:#f5f8f7; --surface:#fff; --text:#14251d; --muted:#5b6c63; --accent:#2f7d32; --border:#e7eeea; }
      body { margin:0; font-family:Segoe UI, Tahoma, sans-serif; background:linear-gradient(135deg, #f9fdf9 0%, var(--bg) 100%); color:var(--text); }
      .container { max-width:900px; margin:0 auto; padding:24px; }
      .nav { display:flex; justify-content:space-between; align-items:center; background:rgba(255,255,255,0.92); padding:16px 20px; border-radius:999px; box-shadow:0 8px 20px rgba(20,37,29,0.06); border:1px solid var(--border); }
      .nav a { margin-left:14px; color:var(--muted); font-weight:600; text-decoration:none; }
      .card { background:var(--surface); border-radius:24px; padding:24px; margin-top:20px; box-shadow:0 16px 35px rgba(20,37,29,0.07); border:1px solid var(--border); }
      .btn { display:inline-block; margin-top:12px; padding:10px 16px; background:linear-gradient(135deg, var(--accent), #3ca04a); color:white; border-radius:999px; text-decoration:none; font-weight:700; }
      .chip { display:inline-block; padding:7px 11px; border-radius:999px; background:#e8f5e9; color:var(--accent); font-weight:700; margin-bottom:10px; }
      @media (max-width:700px){ .nav{border-radius:18px; flex-direction:column; gap:8px;} }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="nav">
        <strong>🐄 CattleSense</strong>
        <div>
          <a href="index.html">Home</a>
          <a href="features.html">Features</a>
          <a href="about.html">About</a>
          <a href="contact.html">Contact</a>
        </div>
      </div>

      <div class="card">
        <div class="chip">Get in touch</div>
        <h1>Contact Us</h1>
        <p>If you want to learn more about CattleSense, reach out for project details, demo requests, or collaboration opportunities.</p>
        <a class="btn" href="mailto:simats.git@gmail.com">Email the Project Team</a>
      </div>
    </div>
  </body>
</html>
